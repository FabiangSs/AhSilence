name: AhSilence - Auto Repair and Android Buil

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ahsilence-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-build:
    name: Repair configuration, build APK, test and lint
    # Prevent an automatic repair commit from starting an endless workflow loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Automatically repair known build configuration issues
        id: repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import stat

          catalog = Path("gradle/libs.versions.toml")
          wrapper = Path("gradlew")

          if not catalog.is_file():
              raise SystemExit("Missing gradle/libs.versions.toml")
          if not wrapper.is_file():
              raise SystemExit("Missing Gradle wrapper script: gradlew")

          original = catalog.read_text(encoding="utf-8")
          updated = original

          compile_sdk_match = re.search(r'(?m)^compileSdk\s*=\s*"?(\d+)"?\s*$', updated)
          agp_match = re.search(r'(?m)^agp\s*=\s*"([^"]+)"', updated)

          if not compile_sdk_match or not agp_match:
              raise SystemExit("Could not safely identify compileSdk or AGP in the version catalog.")

          compile_sdk = int(compile_sdk_match.group(1))
          agp_version = agp_match.group(1)

          def version_tuple(value):
              numbers = re.findall(r'\d+', value)
              return tuple(int(part) for part in numbers[:3])

          # AGP 8.9.x does not support compiling against Android API 36.
          # Upgrade only older AGP versions; leave already newer versions untouched.
          if compile_sdk >= 36 and version_tuple(agp_version) < (8, 10, 0):
              updated = re.sub(
                  r'(?m)^(agp\s*=\s*")[^"]+(")',
                  r'\g<1>8.10.1\\2',
                  updated,
                  count=1
              )
              print(f"Updated Android Gradle Plugin {agp_version} -> 8.10.1 for compileSdk {compile_sdk}.")

          if updated != original:
              catalog.write_text(updated, encoding="utf-8")

          # The repository's wrapper may lose its executable bit on checkout.
          mode = wrapper.stat().st_mode
          wrapper.chmod(mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          changed = updated != original or (mode & stat.S_IXUSR) == 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")

          print("Known configuration checks and repairs completed.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Build installable Debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean assembleDebug 2>&1 | tee build.log

      - name: Run unit tests
        id: tests
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test 2>&1 | tee -a build.log

      - name: Run Android lint
        id: lint
        if: always() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace lint 2>&1 | tee -a build.log

      - name: Save known repairs back to the branch
        if: always() && steps.repair.outputs.changed == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml gradlew
          if git diff --cached --quiet; then
            echo "No repository changes to save."
            exit 0
          fi
          git commit -m "ci: automatically repair Android build configuration"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AhSilence-Android-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results*
            app/build/test-results/
            build.log
          if-no-files-found: warn
          retention-days: 14
